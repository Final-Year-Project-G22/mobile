name: Code Generation & Tests

on:
  pull_request:
    branches: [dev]

jobs:
  generate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Install api_client dependencies
        working-directory: api_client
        run: flutter pub get

      - name: Generate api_client code
        working-directory: api_client
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate main app code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run tests
        run: flutter test
