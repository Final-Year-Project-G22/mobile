name: Lint & Format

on:
  pull_request:
    branches: [dev]

jobs:
  check:
    name: Lint, Format & Codegen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create .env files
        run: |
          mkdir -p assets
          echo "API_BASE_URL=http://localhost:3000" > assets/.env
          echo "API_BASE_URL=http://localhost:3000" > assets/.env.development
          echo "API_BASE_URL=http://localhost:3000" > assets/.env.production

      - name: Install dependencies
        run: flutter pub get

      - name: Install api_client dependencies
        working-directory: api_client
        run: flutter pub get

      - name: Generate api_client code
        working-directory: api_client
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate main app code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: dart analyze --fatal-infos --fatal-warnings

      - name: Format check
        run: find . -name "*.dart" -not -name "*.g.dart" -not -name "*.freezed.dart" -not -path "*/generated/*" -not -path "*/.dart_tool/*" -exec dart format -l 120 --set-exit-if-changed {} +
